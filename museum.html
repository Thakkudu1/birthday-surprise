<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Nichu's 3D Birthday Adventure 💗</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#fff0f7;font-family:Arial,sans-serif;color:#853b67}
#game{position:fixed;inset:0}
#hud{position:fixed;top:0;left:0;right:0;padding:12px;text-align:center;background:linear-gradient(#ffffffdd,transparent);pointer-events:none}
#hud h1{font-size:21px;margin:3px}
#status{font-size:13px;font-weight:bold;margin:5px}
#controls{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:12px;pointer-events:none}
.pad{display:grid;grid-template-columns:52px 52px 52px;grid-template-rows:48px 48px;gap:5px;pointer-events:auto}
button{border:1px solid #e8a3c9;background:#fff0f8eF;color:#963e70;font-size:19px;font-weight:bold;border-radius:15px;box-shadow:0 3px 10px #a84e8040;touch-action:manipulation}
.pad button:nth-child(1){grid-column:2;grid-row:1}
.pad button:nth-child(2){grid-column:1;grid-row:2}
.pad button:nth-child(3){grid-column:2;grid-row:2}
.pad button:nth-child(4){grid-column:3;grid-row:2}
#interact{pointer-events:auto;width:105px;height:52px;font-size:14px}
#panel{position:fixed;inset:0;background:#fff0f7ed;display:none;align-items:center;justify-content:center;padding:22px}
#card{max-width:390px;width:100%;background:white;border:3px solid #f0acd0;border-radius:24px;padding:22px;text-align:center;box-shadow:0 10px 35px #9d4b7a33}
#card h2{margin-top:0}
.choice{display:block;width:100%;padding:13px;margin:9px 0;font-size:16px}
#cake{font-size:62px}
#help{position:fixed;top:94px;left:10px;right:10px;text-align:center;font-size:12px;color:#86436b;pointer-events:none}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
<h1>💗 Nichu's Birthday Adventure 💗</h1>
<div id="status">Room 1 of 4 · Find the heart key!</div>
</div>
<div id="help">Use the arrows to walk. Approach a glowing door and tap Explore.</div>
<div id="controls">
<div class="pad">
<button data-move="forward">⬆️</button>
<button data-move="left">⬅️</button>
<button data-move="back">⬇️</button>
<button data-move="right">➡️</button>
</div>
<button id="interact">✨ Explore</button>
</div>
<div id="panel">
<div id="card">
<h2 id="question">💗 Heart Puzzle</h2>
<p id="description">Choose the correct answer to unlock the next room.</p>
<div id="answers"></div>
<button id="close" class="choice" style="display:none">Continue 💖</button>
</div>
</div><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
(()=>{
const game=document.getElementById('game');
const status=document.getElementById('status');
const panel=document.getElementById('panel');
const question=document.getElementById('question');
const description=document.getElementById('description');
const answers=document.getElementById('answers');
const closeBtn=document.getElementById('close');

if(!window.THREE){
 status.textContent='3D library did not load. Check your internet and reload.';
 return;
}

const scene=new THREE.Scene();
scene.background=new THREE.Color('#ffeaf5');
scene.fog=new THREE.Fog('#ffeaf5',15,34);

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,100);
camera.position.set(0,1.65,7);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
game.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0xe59dc6,2));
const light=new THREE.DirectionalLight(0xffffff,2.4);
light.position.set(-4,9,6);
light.castShadow=true;
scene.add(light);

const pink=new THREE.MeshStandardMaterial({color:'#ffc4e0',roughness:.75});
const white=new THREE.MeshStandardMaterial({color:'#fff8fc',roughness:.8});
const gold=new THREE.MeshStandardMaterial({color:'#f5c96d',metalness:.35,roughness:.35});
const rose=new THREE.MeshStandardMaterial({color:'#ed77b6',emissive:'#8e275f',emissiveIntensity:.25});
const purple=new THREE.MeshStandardMaterial({color:'#bd91e8',emissive:'#5a267f',emissiveIntensity:.25});

function box(w,h,d,mat,x,y,z){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
 m.position.set(x,y,z);
 m.castShadow=true;m.receiveShadow=true;
 scene.add(m);return m;
}

function sphere(r,mat,x,y,z){
 const m=new THREE.Mesh(new THREE.SphereGeometry(r,20,14),mat);
 m.position.set(x,y,z);m.castShadow=true;scene.add(m);return m;
}

function textSprite(label){
 const c=document.createElement('canvas');
 c.width=512;c.height=128;
 const ctx=c.getContext('2d');
 ctx.fillStyle='#fff8fc';ctx.fillRect(0,0,512,128);
 ctx.strokeStyle='#ec91bf';ctx.lineWidth=8;ctx.strokeRect(4,4,504,120);
 ctx.fillStyle='#8e3768';ctx.font='bold 34px Arial';ctx.textAlign='center';
 ctx.fillText(label,256,76);
 const tex=new THREE.CanvasTexture(c);
 const m=new THREE.Mesh(new THREE.PlaneGeometry(4,1),new THREE.MeshBasicMaterial({map:tex,transparent:true}));
 return m;
}

let room=0,unlocked=false,nearDoor=false;
const door=box(2.2,3,.22,rose,0,1.5,-9.72);
const doorLabel=textSprite('LOVE ROOM');
doorLabel.position.set(0,3.55,-9.58);scene.add(doorLabel);

function decorateRoom(){
 box(20,.3,24,pink,0,-.2,-1);
 box(20,.25,24,white,0,4.2,-1);
 box(.25,4.4,24,white,-10,2,-1);
 box(.25,4.4,24,white,10,2,-1);
 box(20,4.4,.25,pink,0,2,-13);
 box(20,4.4,.25,pink,0,2,11);
 for(let x=-8;x<=8;x+=4){
   box(.08,3,.15,gold,x,2,-12.8);
   sphere(.16,gold,x,3.7,-12.65);
 }
 for(let x=-7;x<=7;x+=3.5){
   const frame=box(1.5,1.8,.15,white,x,2.5,-12.78);
   box(1.15,1.4,.08,rose,x,2.5,-12.66);
   sphere(.22,white,x,2.55,-12.55);
 }
 // decorative columns
 for(let x of [-8.5,8.5]){
  for(let z of [-9,-3,3,8]){
   box(.5,3,.5,white,x,1.5,z);
   box(.8,.2,.8,gold,x,3.1,z);
   box(.8,.2,.8,gold,x,.15,z);
  }
 }
 // glowing floating hearts
 for(let i=0;i<18;i++){
  const h=sphere(.16,i%2?rose:purple,(Math.random()-.5)*15,1+Math.random()*2.5,-10+Math.random()*19);
  h.userData.float=Math.random()*6;
 }
 // cake display
 box(2.5,.3,2,white,5,.25,-5);
 const cake=sphere(.72,white,5,1,-5);cake.scale.y=.6;
 sphere(.48,rose,5,1.55,-5);
 for(let i=0;i<5;i++){
  const a=i*Math.PI*2/5;
  box(.07,.45,.07,gold,5+Math.cos(a)*.3,2,-5+Math.sin(a)*.3);
 }
 const sign=textSprite('HAPPY BIRTHDAY');
 sign.position.set(5,3,-5);scene.add(sign);
}
decorateRoom();

const player={x:0,z:7,yaw:0};
const held={};
let lastTime=0;
function setMove(key,on){held[key]=on}
document.querySelectorAll('[data-move]').forEach(btn=>{
 const key=btn.dataset.move;
 btn.addEventListener('pointerdown',e=>{e.preventDefault();setMove(key,true)});
 ['pointerup','pointercancel','pointerleave'].forEach(ev=>btn.addEventListener(ev,()=>setMove(key,false)));
});

function updateStatus(){
 status.textContent=`Room ${room+1} of 4 · ${['Find the heart key!','Solve the memory puzzle!','Unlock the final door!','Birthday surprise unlocked!'][room]}`;
}

function showPuzzle(title,desc,options,onAnswer){
 question.textContent=title;description.textContent=desc;
 answers.innerHTML='';closeBtn.style.display='none';
 options.forEach(o=>{
  const b=document.createElement('button');b.className='choice';b.textContent=o.label;
  b.onclick=()=>{
   if(o.correct){
    description.textContent=o.success||'Correct! The door is glowing brighter! 💗';
    answers.innerHTML='';
    closeBtn.style.display='block';
    closeBtn.onclick=()=>{panel.style.display='none';onAnswer()};
   }else{
    description.textContent='Not quite! Try another answer, Nichu. 💕';
   }
  };
  answers.appendChild(b);
 });
 panel.style.display='flex';
}

function explore(){
 if(panel.style.display==='flex')return;
 const distance=Math.hypot(player.x,player.z+9.5);
 if(distance<4){
  if(room===0){
   showPuzzle('🧩 Level 1: Heart Key','Which symbol means love?',[
    {label:'⭐ Star',correct:false},
    {label:'💗 Heart',correct:true,success:'You found the heart key! The next room is opening.'},
    {label:'🌙 Moon',correct:false}
   ],()=>{room=1;unlocked=true;door.material=gold;updateStatus()});
  }else if(room===1){
   showPuzzle('🧩 Level 2: Memory','What makes a birthday memorable?',[
    {label:'Kindness and memories',correct:true,success:'Wonderful! The memory room is unlocked.'},
    {label:'Only presents',correct:false},
    {label:'Nothing at all',correct:false}
   ],()=>{room=2;door.material=purple;updateStatus()});
  }else if(room===2){
   showPuzzle('🧩 Level 3: Final Door','Choose your final surprise!',[
    {label:'🎂 Birthday Cake',correct:true,success:'All puzzles solved! Happy Birthday, Nichu!'},
    {label:'Close the museum',correct:false}
   ],()=>{room=3;unlocked=true;door.material=rose;updateStatus();showFinal()});
  }else{
   showFinal();
  }
 }else{
  showPuzzle('💗 A Little Reminder','Walk closer to the glowing door at the back of the museum.',[
   {label:'Got it! 💕',correct:true,success:'Use the arrow buttons to walk towards the back door.'}
  ],()=>{});
 }
}

function showFinal(){
 question.textContent='🎂 Happy Birthday, Nichu! 💗';
 description.innerHTML='<div id="cake">🎂🎁💐</div><b>To my best friend and life partner</b><br><br>May your life be filled with love, laughter, beautiful memories and endless happiness. Thank you for being you. — Ashii ❤️';
 answers.innerHTML='';
 closeBtn.textContent='Back to Museum 💕';
 closeBtn.style.display='block';
 closeBtn.onclick=()=>{panel.style.display='none'};
 panel.style.display='flex';
}

document.getElementById('interact').addEventListener('click',explore);

function animate(time){
 requestAnimationFrame(animate);
 const dt=Math.min((time-lastTime)/1000||0,.05);lastTime=time;
 const speed=3.2*dt;
 if(held.forward)player.z-=speed;
 if(held.back)player.z+=speed;
 if(held.left)player.x-=speed;
 if(held.right)player.x+=speed;
 player.x=THREE.MathUtils.clamp(player.x,-8.8,8.8);
 player.z=THREE.MathUtils.clamp(player.z,-10.5,9.5);
 camera.position.set(player.x,1.65,player.z);
 camera.lookAt(player.x,1.5,player.z-5);
 scene.children.forEach(o=>{
  if(o.userData.float!==undefined){
   o.position.y+=Math.sin(time*.001+o.userData.float)*.0015;
  }
 });
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
updateStatus();
})();
</script>
<!-- MUSIC & PHOTO SETTINGS -->
<button id="settingsOpen"
style="position:fixed;top:145px;right:12px;z-index:9999;padding:12px;background:#fff0f8;color:#963e70;border-radius:15px;font-weight:bold">
⚙️ Settings
</button>

<div id="settingsPanel" style="display:none;position:fixed;inset:0;z-index:30;background:#fff0f7f5;overflow:auto;padding:20px;color:#853b67;font-family:Arial,sans-serif">
  <div style="max-width:440px;margin:30px auto;background:white;padding:22px;border-radius:22px;border:2px solid #f0acd0">
    <h2>💗 Nichu's Settings</h2><h3>🎵 Choose Music</h3>
<input id="musicFile" type="file" accept="audio/*" style="width:100%">
<audio id="musicPlayer" controls style="width:100%;margin-top:12px"></audio>

<h3>📸 Choose Photos</h3>
<input id="photoFiles" type="file" accept="image/*" multiple style="width:100%">
<div id="photoPreview" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px"></div>

<h3>💌 Birthday Message</h3>
<textarea id="birthdayText" rows="3" style="width:100%;padding:10px;border:1px solid pink;border-radius:10px">Happy Birthday, Nichu! 💗 You make life beautiful. — Ashii ❤️</textarea>

<button id="saveSettings" style="padding:12px;border:0;border-radius:12px;background:#e879b0;color:white;margin-top:12px">💾 Save Message</button>
<button id="settingsClose" style="padding:12px;border:0;border-radius:12px;background:#fce1ef;color:#853b67;margin-top:12px">Close ✖️</button>
<p id="settingsStatus"></p>

  </div>
</div>

<script>
(() => {
  const open = document.getElementById('settingsOpen');
  const panel = document.getElementById('settingsPanel');
  const close = document.getElementById('settingsClose');
  const musicFile = document.getElementById('musicFile');
  const player = document.getElementById('musicPlayer');
  const photoFiles = document.getElementById('photoFiles');
  const preview = document.getElementById('photoPreview');
  const message = document.getElementById('birthdayText');
  const status = document.getElementById('settingsStatus');

  open.addEventListener('click', () => panel.style.display = 'block');
  close.addEventListener('click', () => panel.style.display = 'none');

  musicFile.addEventListener('change', () => {
    const file = musicFile.files[0];
    if (!file) return;
    if (player.dataset.url) URL.revokeObjectURL(player.dataset.url);
    const url = URL.createObjectURL(file);
    player.dataset.url = url;
    player.src = url;
    player.play().catch(() => {
      status.textContent = 'Press Play on the music player to start the song.';
    });
  });

  photoFiles.addEventListener('change', () => {
    preview.replaceChildren();
    Array.from(photoFiles.files).forEach(file => {
      if (!file.type.startsWith('image/')) return;
      const img = document.createElement('img');
      img.alt = 'Selected memory photo';
      img.src = URL.createObjectURL(file);
      img.style.cssText = 'width:95px;height:95px;object-fit:cover;border-radius:12px;border:2px solid pink';
      preview.appendChild(img);
    });
    status.textContent = 'Selected photos are previewed here. They are not uploaded to GitHub.';
  });

  try {
    message.value = localStorage.getItem('nichuBirthdayMessage') || message.value;
  } catch (e) {}

  document.getElementById('saveSettings').addEventListener('click', () => {
    try {
      localStorage.setItem('nichuBirthdayMessage', message.value);
      status.textContent = 'Birthday message saved on this browser! 💗';
    } catch (e) {
      status.textContent = 'Message could not be saved in this browser.';
    }
  });
})();
</script></body> 
</html>
